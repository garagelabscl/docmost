version: 0.0
os: linux
# La instalación ya vive en el destino: reemplazar los archivos que coincidan con el repo.
file_exists_behavior: OVERWRITE

files:
  - source: /
    destination: /home/ec2-user/docmost

permissions:
  - object: /home/ec2-user/docmost
    owner: ec2-user
    group: ec2-user

hooks:
  ApplicationStart:
    - location: scripts/deploy.sh
      timeout: 3600
      runas: root
  ValidateService:
    - location: scripts/healthcheck.sh
      timeout: 300
      runas: root
